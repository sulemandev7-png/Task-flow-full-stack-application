services:
  frontend:
    build: ./frontend
    image: suleman08/task-application:frontend   # ← add this
    container_name: task-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
  
  backend:
    build: ./backend
    image: suleman08/task-application:backend     # ← add this
    container_name: task-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
       PORT: 5000
       CLIENT_URL: http://localhost

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"